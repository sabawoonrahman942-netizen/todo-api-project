name: Deploy Todo API

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
           python3 -m pip install --break-system-packages -r requirements.txt

      - name: Run tests
        run: |
          pytest


  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          docker compose down
          docker compose up -d --build
